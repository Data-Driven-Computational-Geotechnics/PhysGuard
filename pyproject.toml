[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physguard"
version = "1.0.0"
description = "PhysGuard (NeurIPS 2026): Fisher-guided gradient projection for sim-to-real neural PDE surrogates."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Changjian Zhou", email = "changjianz@student.unimelb.edu.au" },
  { name = "Junfeng Fang" },
  { name = "Negin Yousefpour", email = "negin.yousefpour@unimelb.edu.au" },
  { name = "Peng Wu" },
  { name = "Bin Yan" },
  { name = "Guillermo Narsilio" },
]
keywords = [
  "scientific-ml",
  "physics",
  "pde",
  "sim-to-real",
  "fluid-dynamics",
  "combustion",
  "spatiotemporal",
  "neural-operator",
  "fisher-information",
  "neurips-2026",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "License :: Free for non-commercial use",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "tqdm",
  "torch",
  "torchvision",
  "torchinfo",
  "h5py",
  "pyyaml",
  "tensorboard",
  "einops",
  "einops-exts",
  "rotary-embedding-torch",
  "PyWavelets",
  "pytorch-wavelets",
  "ptwt",
  "pandas",
  "timm",
  "seaborn",
  "psutil",
  "requests",
  "huggingface-hub",
  "datasets",
]

[project.urls]
Homepage = "https://github.com/Data-Driven-Computational-Geotechnics/PhysGuard"
Repository = "https://github.com/Data-Driven-Computational-Geotechnics/PhysGuard"
Paper = "https://arxiv.org/abs/2606.16602"
Issues = "https://github.com/Data-Driven-Computational-Geotechnics/PhysGuard/issues"

[project.scripts]
benchmark = "benchmark.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["physguard", "physguard.*", "benchmark", "benchmark.*"]


